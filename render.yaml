services:
  - type: web
    name: nepa-health-web
    env: node
    root: .
    branch: main
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: false
    autoDeploy: true
