databases:
  - name: upshift-db
    plan: free
    region: singapore
    databaseName: upshift
    user: upshift
services:
  - type: web
    name: upshift-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npx prisma generate && npm run build:api
    startCommand: npx prisma migrate deploy && npm run db:seed && npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: upshift-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
  - type: web
    name: upshift-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build:web
    startCommand: npm run start:web
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: API_PROXY_TARGET
        value: https://upshift-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: YOUTUBE_CHANNEL_URL
        sync: false
