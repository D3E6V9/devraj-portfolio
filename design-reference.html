<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upshift — learn intentionally</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F14;--s2:#121922;--s3:#18212B;--lime:#C4F56A;--tx:#F4F6F0;--mut:#A0AAB6;--bd:#293341;--light:#F5F5EF;--dk:#182019;--r:14px;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Inter,system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Manrope,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
a{color:inherit}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible,label:focus-within{outline:2px solid var(--lime);outline-offset:3px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd)}
header .w{display:flex;align-items:center;gap:20px;height:60px}
.logo{font-weight:800;font-size:22px;text-decoration:none}.logo i{color:var(--lime);font-style:normal}
nav{display:flex;gap:18px;margin-left:auto;align-items:center;font-size:15px;color:var(--mut)}
nav a{text-decoration:none}nav a:hover,nav a.on{color:var(--tx)}
.btn{display:inline-block;padding:11px 20px;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid var(--bd);background:none;color:var(--tx);cursor:pointer;font:600 15px Inter}
.btn.p{background:var(--lime);color:var(--dk);border-color:var(--lime)}.btn.p:hover{filter:brightness(.92)}.btn:not(.p):hover{border-color:var(--mut)}
.hero{padding:88px 0 72px;display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:800}
.hero p{color:var(--mut);max-width:48ch;font-size:18px;margin:22px 0 30px}
.sm{color:var(--mut);font-size:14px}
.steps{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.steps div{background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;font:700 15px Manrope}
.sec{padding:64px 0}.light{background:var(--light);color:var(--dk)}.light .sm,.light p{color:#4a554c}
.sec h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:28px}
.card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.card:hover{border-color:var(--lime)}
.cov{aspect-ratio:16/9;display:flex;align-items:flex-end;padding:14px;font:800 22px Manrope;color:var(--dk)}
.cb{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}.cb h3{font-size:19px}
.tag{color:var(--lime);font-size:13px;font-weight:500}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;margin-top:28px}
.three h3{font-size:20px;margin-bottom:6px}
.ph{width:140px;aspect-ratio:1;border:1px dashed var(--mut);border-radius:50%;display:grid;place-items:center;color:var(--mut);font-size:13px;text-align:center}
.cta{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:36px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer{border-top:1px solid var(--bd);padding:36px 0;color:var(--mut);font-size:14px}
footer .w{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}
input[type=search],select{background:var(--s2);border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:11px 14px;font:15px Inter;min-width:0}
input[type=search]{flex:1 1 240px}
.empty{padding:48px;text-align:center;border:1px dashed var(--bd);border-radius:var(--r);color:var(--mut);margin-top:28px}
.page{padding:48px 0 72px}.page h1{font-size:clamp(32px,5vw,54px);max-width:18ch}
.two{display:grid;grid-template-columns:1fr 320px;gap:32px;margin-top:28px;align-items:start}
.panel{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:20px}
ul.obj{padding-left:20px;margin:8px 0}
details{border:1px solid var(--bd);border-radius:12px;background:var(--s2);margin:10px 0}
summary{padding:14px 16px;cursor:pointer;font:700 16px Manrope}
.les{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 16px;border-top:1px solid var(--bd);text-decoration:none;font-size:15px}
.les:hover{background:var(--s3)}.les.on{background:var(--s3);box-shadow:inset 3px 0 var(--lime);font-weight:500}
.les.qz{color:var(--lime)}
.vid{aspect-ratio:16/9;background:#000;border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);display:grid;place-items:center;text-align:center;color:var(--mut);padding:20px}
.vid iframe{width:100%;height:100%;border:0}
.crumb{font-size:14px;color:var(--mut);margin-bottom:12px}.crumb a{color:var(--mut)}
.nav2{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--bd);border-radius:10px;margin:10px 0;cursor:pointer;background:var(--s2)}
.opt.sel{border-color:var(--lime);background:var(--s3)}.opt.ok{border-color:var(--lime)}.opt.no{border-color:#e08a7a}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:var(--lime)}
.note{font-size:14px;color:var(--mut);margin-top:14px}.warn{color:#f2c97a;font-size:14px;min-height:22px}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.hero{padding:48px 0}.steps{display:none}nav .hide{display:none}nav{gap:14px}.side{order:-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.card,.btn{transition:border-color .15s,filter .15s}
</style></head>
<body>
<header><div class="w"><a class="logo" href="#home">upshift<i>↑</i></a>
<nav><a href="#home" data-n="home" class="hide">Home</a><a href="#learn" data-n="learn">Learn</a><a href="#about" data-n="about">About</a><a id="ytn" target="_blank" rel="noopener">YouTube</a><a class="btn p hide" href="#learn" style="padding:8px 14px">Explore courses</a></nav></div></header>
<main id="app"></main>
<footer><div class="w"><div><span class="logo" style="font-size:18px;color:var(--tx)">upshift<i>↑</i></span><p style="margin:6px 0 0;max-width:36ch">Learn intentionally. Build better habits. Become better every day.</p></div>
<div><a href="#learn">Learn</a> · <a href="#about">About</a> · <a id="ytf" target="_blank" rel="noopener">YouTube</a><p style="margin:6px 0 0">© <span id="yr"></span> Upshift. Demonstration content.</p></div></div></footer>
<script>
const CONFIG={youtube:"",contact:""}; // set your real channel URL here
const COLORS=["#C4F56A","#E9F7B8","#9FD8C6","#F2E3A4","#B9C6F2","#F0C6B8"];
const C=[
{s:"build-better-habits",t:"Build Better Habits",c:"Habits",lv:"Beginner",d:"Understand how habits form, then design small routines that stick.",aud:"Anyone who starts strong and fades after a week.",obj:["Explain the cue, craving, response and reward loop","Spot what usually breaks your consistency","Apply one technique to a real routine this week"],feat:1,
 ch:[{t:"How habits work",d:"The loop behind every routine.",L:[["The habit loop","What a habit is made of.",12],["Why small beats big","Starting size and staying power.",9]],Q:[["Which is NOT part of the habit loop?",["Cue","Reward","Punishment","Response"],2,"The loop is cue, craving, response, reward."],["Why start with a very small habit?",["It looks impressive","It lowers the effort needed to begin","Big habits are impossible","It skips the cue"],1,"Low effort makes starting likely, and repetition builds the habit."]]},
 {t:"Making it stick",d:"Design your environment and plan ahead.",L:[["Design your environment","Make good cues obvious.",11],["If-then planning","Decide before the moment arrives.",8]],Q:[["An if-then plan means…",["Waiting for motivation","Choosing the trigger and action in advance","Tracking only streaks","Rewarding yourself later"],1,"You pre-decide the trigger and the response."]]}]},
{s:"master-your-focus",t:"Master Your Focus",c:"Focus",lv:"Intermediate",d:"Protect your attention and work in deeper, calmer blocks.",aud:"Students and professionals who are always distracted.",obj:["Identify your biggest attention leaks","Set up a distraction-light workspace","Run a focused session end to end"],
 ch:[{t:"Where attention goes",d:"Understand what pulls you away.",L:[["The cost of switching","Why multitasking drains you.",10],["Audit your distractions","Find the real leaks.",7]],Q:[["Task switching mostly…",["Saves time","Adds mental overhead","Improves memory","Has no cost"],1,"Each switch carries a re-orientation cost."]]}]},
{s:"beat-procrastination",t:"Beat Procrastination",c:"Discipline",lv:"Beginner",d:"Learn why you delay and use practical ways to begin.",aud:"Anyone who keeps putting off what matters.",obj:["Name why you are avoiding a task","Shrink the first step","Build a restart routine"],ch:[{t:"Why we delay",d:"It is about emotion, not laziness.",L:[["Procrastination is a feeling problem","Avoiding discomfort.",9],["The two-minute start","Shrink the first step.",6]],Q:[]}]},
{s:"the-art-of-deep-work",t:"The Art of Deep Work",c:"Productivity",lv:"Intermediate",d:"Make time for work that needs your full attention.",aud:"Creators and knowledge workers.",obj:["Define deep work for your role","Schedule it","Shut down cleanly"],ch:[{t:"Foundations",d:"What deep work is.",L:[["What counts as deep work","Definition and examples.",10],["Scheduling depth","Protect the block.",8]],Q:[]}]},
{s:"build-discipline-that-lasts",t:"Build Discipline That Lasts",c:"Discipline",lv:"Intermediate",d:"Move from motivation to systems you can rely on.",aud:"People who rely on willpower alone.",obj:["Separate motivation from discipline","Create simple rules","Recover after a miss"],ch:[{t:"Beyond willpower",d:"Systems over mood.",L:[["Motivation vs discipline","They are different tools.",9],["Rules you can keep","Keep them simple.",7]],Q:[]}]},
{s:"design-your-ideal-morning",t:"Design Your Ideal Morning",c:"Mindset",lv:"Beginner",d:"Shape a morning that supports the rest of your day.",aud:"Anyone who starts the day reactive.",obj:["Choose three morning anchors","Prepare the night before","Adjust without guilt"],ch:[{t:"Anchors",d:"Small fixed points.",L:[["Pick three anchors","Keep it light.",8],["The night-before setup","Make morning easy.",6]],Q:[]}]}];
const $=s=>document.querySelector(s),app=$("#app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ytId=u=>{const m=String(u||"").match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/)||String(u||"").match(/^([\w-]{11})$/);return m?m[1]:null};
C.forEach((c,ci)=>{c.col=COLORS[ci%6];c.ch.forEach((h,hi)=>h.L=h.L.map((l,li)=>({t:l[0],d:l[1],m:l[2],slug:"l"+(hi+1)+"-"+(li+1),vid:null,h:hi})))});
const cnt=c=>({ch:c.ch.length,ls:c.ch.reduce((a,h)=>a+h.L.length,0),m:c.ch.reduce((a,h)=>a+h.L.reduce((b,l)=>b+l.m,0),0)});
const cget=s=>C.find(c=>c.s===s);
const flat=c=>c.ch.flatMap(h=>h.L);
function card(c){const n=cnt(c);return `<a class="card" href="#c-${c.s}"><div class="cov" style="background:${c.col}">${esc(c.t)}</div><div class="cb"><span class="tag">${c.c}</span><h3>${esc(c.t)}</h3><span class="sm">${esc(c.d)}</span><span class="sm" style="margin-top:auto;padding-top:8px">${n.ch} chapters, ${n.ls} lessons, ${n.m} min. Free</span></div></a>`}
let F={q:"",cat:""};
const R={
home(){return `<div class="w hero"><div><p class="sm" style="margin:0 0 14px;color:var(--lime)">Your journey to better</p><h1>Become a little better, every single day.</h1><p>Thoughtfully curated video courses on habits, focus, productivity, and personal growth. Learn from great ideas, one lesson at a time.</p><a class="btn p" href="#learn">Explore Courses</a> <a class="btn" href="${CONFIG.youtube||'#about'}" ${CONFIG.youtube?'target="_blank" rel="noopener"':''}>Visit YouTube</a></div>
<div class="steps" aria-hidden="true"><div style="margin-left:0">Day 1: one small habit</div><div style="margin-left:36px">Week 1: it feels normal</div><div style="margin-left:72px;background:var(--lime);color:var(--dk)">Month 3: you are someone new</div></div></div>
<section class="sec w"><h2>Featured learning paths</h2><p class="sm">Demonstration content. Real lessons appear once videos are added.</p><div class="grid">${C.slice(0,3).map(card).join("")}</div></section>
<section class="sec light"><div class="w"><h2 style="max-width:20ch">Don't just consume ideas. Put them into practice.</h2><p style="max-width:60ch">Upshift organizes free educational videos into structured paths, with chapters and short assessments to reinforce what you learn.</p><div class="three"><div><h3>Learn with intention</h3><p>Pick a goal, then follow a path built around it.</p></div><div><h3>Practice what matters</h3><p>Each chapter ends with questions that check understanding.</p></div><div><h3>Improve consistently</h3><p>Short lessons you can finish between other things.</p></div></div></div></section>
<section class="sec w"><h2>How it works</h2><div class="three"><div><h3>1. Choose a course</h3><p class="sm">Match it to your goal.</p></div><div><h3>2. Watch the lessons</h3><p class="sm">Work through chapters in order.</p></div><div><h3>3. Take the assessment</h3><p class="sm">Check it, then apply it.</p></div></div></section>
<section class="sec w" style="display:flex;gap:32px;flex-wrap:wrap;align-items:center"><div class="ph">Creator portrait<br>(placeholder)</div><div style="flex:1 1 300px"><h2>Meet the creator</h2><p class="sm">[Editable placeholder: add your introduction and why you built Upshift.]</p><a class="btn" href="#about">About Upshift</a></div></section>
<section class="sec w"><div class="cta"><div><h2 style="font-size:28px">Start at the source</h2><p class="sm" style="max-width:52ch;margin:6px 0 0">The library curates publicly available YouTube videos into a more structured experience.</p></div><a class="btn p" href="${CONFIG.youtube||'#about'}" ${CONFIG.youtube?'target="_blank" rel="noopener"':''}>Visit YouTube</a></div></section>`},
learn(){const cats=[...new Set(C.map(c=>c.c))];return `<div class="w page"><h1>Learn something that moves you forward.</h1><p class="sm" style="max-width:56ch;font-size:17px">Free, carefully curated video courses to help you build better habits, focus deeper, and work toward becoming your best self.</p>
<div class="tools"><input type="search" id="q" placeholder="Search courses" aria-label="Search courses" value="${esc(F.q)}"><select id="cat" aria-label="Category"><option value="">All categories</option>${cats.map(x=>`<option ${F.cat===x?"selected":""}>${x}</option>`).join("")}</select><button class="btn" id="rs">Reset</button></div><div id="res" aria-live="polite"></div></div>`},
about(){return `<div class="w page"><h1>Why Upshift exists</h1><div style="max-width:62ch;margin-top:24px"><div class="ph" style="margin-bottom:24px">Photo<br>(placeholder)</div><p>[Editable placeholder: introduce yourself and the reason you started Upshift.]</p><p class="sm">Upshift believes self-improvement works best when it is intentional: fewer videos, better chosen, then put into practice. Curating free educational videos into paths makes good ideas easier to follow through on.</p><a class="btn p" href="#learn">Explore courses</a></div></div>`},
course(c){const n=cnt(c),f=flat(c)[0];return `<div class="w page"><div class="crumb"><a href="#learn">Learn</a> / ${esc(c.t)}</div><span class="tag">${c.c} · ${c.lv}</span><h1>${esc(c.t)}</h1><p style="max-width:60ch;color:var(--mut)">${esc(c.d)}</p><p class="sm">${n.ch} chapters, ${n.ls} lessons, about ${n.m} min. Free.</p><a class="btn p" href="#l-${c.s}-${f.slug}">Start Course</a>
<div class="two"><div><h2 style="font-size:26px">Curriculum</h2>${c.ch.map((h,i)=>`<details ${i==0?"open":""}><summary>Chapter ${i+1}: ${esc(h.t)} <span class="sm">(${h.L.length} lessons)</span></summary><div class="sm" style="padding:0 16px 12px">${esc(h.d)}</div>${h.L.map(l=>`<a class="les" href="#l-${c.s}-${l.slug}"><span>${esc(l.t)}</span><span class="sm">${l.m} min · Watch</span></a>`).join("")}${h.Q.length?`<a class="les qz" href="#q-${c.s}-${i+1}">Chapter assessment · ${h.Q.length} questions</a>`:""}</details>`).join("")}</div>
<div class="panel side"><h3>What you will learn</h3><ul class="obj">${c.obj.map(o=>`<li>${esc(o)}</li>`).join("")}</ul><h3 style="margin-top:16px">Who it is for</h3><p class="sm">${esc(c.aud)}</p><p class="note">Lessons use free, publicly available YouTube videos.</p></div></div></div>`},
side(c,act){return `<details class="panel side" open style="padding:0"><summary>${esc(c.t)}</summary>${c.ch.map((h,i)=>`<div class="sm" style="padding:8px 16px;border-top:1px solid var(--bd)">Chapter ${i+1}: ${esc(h.t)}</div>${h.L.map(l=>`<a class="les ${act===l.slug?"on":""}" href="#l-${c.s}-${l.slug}">${esc(l.t)}</a>`).join("")}${h.Q.length?`<a class="les qz ${act==="q"+(i+1)?"on":""}" href="#q-${c.s}-${i+1}">Assessment</a>`:""}`).join("")}</details>`},
lesson(c,ls){const L=flat(c),i=L.findIndex(l=>l.slug===ls);if(i<0)return R.nf();const l=L[i],h=c.ch[l.h],p=L[i-1],nx=L[i+1],last=h.L[h.L.length-1]===l;
const id=ytId(l.vid),link=id?`https://www.youtube.com/watch?v=${id}`:CONFIG.youtube;
let next;if(last&&h.Q.length)next=`<a class="btn p" href="#q-${c.s}-${l.h+1}">Take chapter assessment</a>`;else if(nx)next=`<a class="btn p" href="#l-${c.s}-${nx.slug}">Next lesson</a>`;else next=`<a class="btn p" href="#learn">Course complete. Explore another</a>`;
return `<div class="w page" style="padding-top:28px"><div class="crumb"><a href="#learn">Learn</a> / <a href="#c-${c.s}">${esc(c.t)}</a> / Chapter ${l.h+1}</div><div class="two" style="grid-template-columns:1fr 320px;margin-top:0"><div><h1 style="font-size:clamp(26px,4vw,38px);margin-bottom:16px">${esc(l.t)}</h1>
<div class="vid">${id?`<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="${esc(l.t)}" allowfullscreen loading="lazy"></iframe>`:`<div>Demo placeholder.<br>An admin adds a YouTube URL here and the lesson plays in a privacy-enhanced player.</div>`}</div>
<p style="color:var(--mut)">${esc(l.d)}</p>${link?`<a class="sm" href="${link}" target="_blank" rel="noopener">Watch on YouTube</a>`:""}
<div class="nav2">${p?`<a class="btn" href="#l-${c.s}-${p.slug}">Previous</a>`:`<a class="btn" href="#c-${c.s}">Curriculum</a>`}${next}</div></div>${R.side(c,ls)}</div></div>`},
quiz(c,n){const h=c.ch[n-1];if(!h||!h.Q.length)return R.nf();return `<div class="w page"><div class="crumb"><a href="#c-${c.s}">${esc(c.t)}</a> / Chapter ${n} assessment</div><div class="two"><div id="qz"></div>${R.side(c,"q"+n)}</div></div>`},
nf(){return `<div class="w page"><h1>Page not found</h1><p class="sm">Try the <a href="#learn">course library</a>.</p></div>`}};
function res(){const q=F.q.toLowerCase(),r=C.filter(c=>(!F.cat||c.c===F.cat)&&(!q||(c.t+" "+c.d).toLowerCase().includes(q)));$("#res").innerHTML=r.length?`<div class="grid" style="margin-top:0">${r.map(card).join("")}</div>`:`<div class="empty">No courses match. <a href="#learn" id="rs2">Reset filters</a> to see all.</div>`;const b=$("#rs2");if(b)b.onclick=e=>{e.preventDefault();rst()}}
function rst(){F={q:"",cat:""};$("#q").value="";$("#cat").value="";res()}
function runQuiz(c,n){const Q=c.ch[n-1].Q,st={i:0,a:Array(Q.length).fill(null),done:false},el=$("#qz");
const draw=()=>{if(st.done){const k=Q.filter((q,i)=>st.a[i]===q[2]).length,pc=Math.round(k/Q.length*100),nx=c.ch[n];
el.innerHTML=`<h1 style="font-size:32px">${pc}%</h1><p>${k} of ${Q.length} correct. ${pc>=70?"Nicely done.":"Good start. Another look at the lessons will help."}</p>${Q.map((q,i)=>`<div class="panel" style="margin:10px 0"><b>${esc(q[0])}</b><p class="sm" style="margin:6px 0 0">${st.a[i]===q[2]?"Correct":"Answer: "+esc(q[1][q[2]])}. ${esc(q[3])}</p></div>`).join("")}<div class="nav2"><button class="btn" id="rt">Retry</button><a class="btn" href="#c-${c.s}">Revisit lessons</a>${nx?`<a class="btn p" href="#l-${c.s}-${nx.L[0].slug}">Next chapter</a>`:`<a class="btn p" href="#learn">Explore another course</a>`}</div>`;$("#rt").onclick=()=>{st.i=0;st.a.fill(null);st.done=false;draw()};return}
const q=Q[st.i];el.innerHTML=`<p class="sm">Question ${st.i+1} of ${Q.length}</p><div class="bar"><i style="width:${(st.i+1)/Q.length*100}%"></i></div><h2 style="font-size:24px;margin-bottom:12px">${esc(q[0])}</h2><fieldset style="border:0;padding:0;margin:0">${q[1].map((o,j)=>`<label class="opt ${st.a[st.i]===j?"sel":""}"><input type="radio" name="o" value="${j}" ${st.a[st.i]===j?"checked":""}> ${esc(o)}</label>`).join("")}</fieldset><div class="warn" id="w"></div><div class="nav2">${st.i?`<button class="btn" id="pv">Previous</button>`:"<span></span>"}<button class="btn p" id="nx">${st.i<Q.length-1?"Next question":"Submit"}</button></div>`;
el.querySelectorAll("input").forEach(r=>r.onchange=()=>{st.a[st.i]=+r.value;draw();el.querySelector("input:checked").focus()});
const pv=$("#pv");if(pv)pv.onclick=()=>{st.i--;draw()};
$("#nx").onclick=()=>{if(st.a[st.i]===null){$("#w").textContent="Choose an answer to continue.";return}if(st.i<Q.length-1)st.i++;else if(st.a.includes(null)){$("#w").textContent="Some questions are unanswered. Go back to finish them.";return}else st.done=true;draw()}};draw()}
function route(){const h=(location.hash||"#home").slice(1);let m;
const set=html=>{app.innerHTML=html;window.scrollTo(0,0)};
document.querySelectorAll("nav [data-n]").forEach(a=>a.classList.toggle("on",a.dataset.n===h.split("-")[0]));
if(h==="home")set(R.home());
else if(h==="learn"){set(R.learn());res();$("#q").oninput=e=>{F.q=e.target.value;res()};$("#cat").onchange=e=>{F.cat=e.target.value;res()};$("#rs").onclick=rst}
else if(h==="about")set(R.about());
else if(m=h.match(/^c-(.+)$/)){const c=cget(m[1]);set(c?R.course(c):R.nf())}
else if(m=h.match(/^l-(.+)-(l\d+-\d+)$/)){const c=cget(m[1]);set(c?R.lesson(c,m[2]):R.nf())}
else if(m=h.match(/^q-(.+)-(\d+)$/)){const c=cget(m[1]);if(c){set(R.quiz(c,+m[2]));if($("#qz"))runQuiz(c,+m[2])}else set(R.nf())}
else set(R.nf())}
["ytn","ytf"].forEach(i=>{const a=$("#"+i);if(CONFIG.youtube){a.href=CONFIG.youtube}else{a.href="#about";a.removeAttribute("target");a.title="Set CONFIG.youtube to your channel URL"}});
$("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",route);route();
</script></body></html>
